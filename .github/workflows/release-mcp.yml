name: Release MCP

on:
  push:
    tags:
      - "mcp/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Require the release metadata
        if: github.event_name == 'push'
        working-directory: mcp
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/mcp/v}"
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' gia/version.go)"
          if [ "$tag" != "$version" ]; then
            echo "tag version ${tag} does not match gia/version.go ${version}"
            exit 1
          fi
          sdk="$(awk '$1 == "github.com/anwerj/gia-db/go" { print $2; exit }' go.mod)"
          printf '%s\n' "$sdk" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$sdk" = "v0.0.0" ]; then
            echo "mcp/go.mod must require a published Go SDK version"
            exit 1
          fi
          if grep -q '^replace github.com/anwerj/gia-db/go =>' go.mod; then
            echo "mcp/go.mod must not use a local Go SDK replace for a release"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: mcp/go.sum

      - name: Check formatting
        working-directory: mcp
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: mcp
        run: go vet ./...

      - name: Test
        working-directory: mcp
        run: go test -race ./...

      - name: Build
        working-directory: mcp
        run: go build -o gia-mcp .

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gia-mcp-linux-amd64
          path: mcp/gia-mcp

  publish:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Download binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: gia-mcp-linux-amd64
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --verify-tag \
            --generate-notes \
            dist/gia-mcp
