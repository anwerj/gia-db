name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      go: ${{ steps.filter.outputs.go }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          mark_all() {
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mark_all
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit; running every implemented check."
            mark_all
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "Base commit ${BASE_SHA} is unavailable; running every implemented check."
            mark_all
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          db=false
          go_changed=false
          workflows=false
          if grep -q '^db/' "$RUNNER_TEMP/changed.txt"; then
            db=true
          fi
          if grep -q '^go/' "$RUNNER_TEMP/changed.txt"; then
            go_changed=true
          fi
          if grep -q '^\.github/workflows/' "$RUNNER_TEMP/changed.txt"; then
            workflows=true
          fi
          {
            echo "db=${db}"
            echo "go=${go_changed}"
            echo "workflows=${workflows}"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed.txt"

  contract:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: db/tools/requirements.txt

      - name: Install contract validator
        run: python -m pip install -r db/tools/requirements.txt

      - name: Parse contract JSON
        run: |
          python -m json.tool db/contract/v0.1/manifest.json >/dev/null
          for file in db/contract/v0.1/*.json; do
            python -m json.tool "$file" >/dev/null
          done

      - name: Verify manifest checksums
        working-directory: db/contract/v0.1
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          for entry in manifest["files"]:
              actual = hashlib.sha256(Path(entry["path"]).read_bytes()).hexdigest()
              assert actual == entry["sha256"], (entry["path"], actual)
          PY

      - name: Validate schemas, examples, and conformance
        run: python db/tools/validate_contract.py

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  summary:
    needs: [changes, contract, go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          CONTRACT: ${{ needs.contract.result }}
          GO_RESULT: ${{ needs.go.result }}
          DB: ${{ needs.changes.outputs.db }}
          GO_CHANGED: ${{ needs.changes.outputs.go }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
        run: |
          set -eu
          echo "changes=${CHANGES} contract=${CONTRACT} go=${GO_RESULT} db=${DB} go_changed=${GO_CHANGED} workflows=${WORKFLOWS}"
          if [ "$CHANGES" != "success" ]; then
            echo "changes job must succeed"
            exit 1
          fi
          contract_required=false
          go_required=false
          if [ "$DB" = "true" ] || [ "$WORKFLOWS" = "true" ]; then
            contract_required=true
          fi
          if [ "$GO_CHANGED" = "true" ] || [ "$DB" = "true" ] || [ "$WORKFLOWS" = "true" ]; then
            go_required=true
          fi
          check() {
            name="$1"
            result="$2"
            required="$3"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "${name} ${result}"
              exit 1
            fi
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "${name} was required but its result is ${result}"
              exit 1
            fi
          }
          check contract "$CONTRACT" "$contract_required"
          check go "$GO_RESULT" "$go_required"
          {
            echo "### CI summary"
            echo "Contract required: \`${contract_required}\` (${CONTRACT})"
            echo "Go required: \`${go_required}\` (${GO_RESULT})"
          } >> "$GITHUB_STEP_SUMMARY"
